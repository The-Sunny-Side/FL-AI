<div class="card">
    <!-- Intestazione -->
    <div class="card-header">
      <h3>Trip a {{ localita }}</h3>
    </div>
  
    <div class="card-content">
      <!-- Immagine -->
      <img src="assets/beach.jpg" alt="Immagine di {{ localita }}" class="card-image" />
  
      <!-- Testo -->
      <div class="card-details">
        <p><strong>Durata:</strong> {{ durata }}</p>
        <p><strong>Albergo:</strong> {{ albergo }}</p>
        <p class="costo"><strong>Costo:</strong> {{ costo }} €</p>
      </div>
    </div>
  
    <!-- Bottone -->
    <div class="card-footer">
      <button class="btn">Reindirizzami ➡️</button>
    </div>
  </div>
